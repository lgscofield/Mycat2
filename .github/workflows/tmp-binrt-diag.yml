name: tmp-binrt-diag
# 一次性诊断（M3 取证轮）：Linux runner 上 mysql:5.7 档 binrt 中文损化（?=?0x3F）定位。
# 取证完成即删除本文件。
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    services:
      mysql-a:
        image: mysql:5.7
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mysql-b:
        image: mysql:5.7
        ports: [ "3307:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build server jar
        run: mvn -B install '-Dmaven.test.skip=true' -pl server -am
      - name: Backend charset truth (pre)
        run: |
          docker run --rm mysql:5.7 mysql --get-server-public-key --ssl-mode=DISABLED -h127.0.0.1 -P3306 -uroot -p123456 -N -B -e 'SELECT @@character_set_server, @@version;' || true
      - name: Run binrt script (5.7 tier)
        continue-on-error: true
        env:
          COMPAT_DB: mysql:5.7
          MYCAT_PERSONA: MYSQL_5_7
        run: bash ci/verify-mysqldump-binary-roundtrip.sh
      - name: Post-mortem evidence
        if: always()
        run: |
          echo '===== dump.sql (head 80) ====='
          head -n 80 target/ci/binroundtrip-dump.sql || true
          echo '===== dump.sql INSERT lines ====='
          grep -a 'INSERT INTO' target/ci/binroundtrip-dump.sql | head -c 2000 || true
          echo
          echo '===== dump.sql hex of 探针/?? region ====='
          grep -a 't1' target/ci/binroundtrip-dump.sql | head -c 3000 | xxd | head -n 60 || true
          echo '===== server log: charset/SET NAMES related ====='
          grep -aiE 'character|charset|SET NAMES|latin1|utf8' target/ci/binroundtrip-server.log | head -n 60 || true
          echo '===== seed readback via Mycat directly ====='
          docker run --rm mysql:5.7 mysql --get-server-public-key --ssl-mode=DISABLED --default-character-set=utf8mb4 -h127.0.0.1 -P8066 -uroot -p123456 -N -B -e 'SELECT id,HEX(name) FROM dbdump.t1 ORDER BY id;' || true
          echo '===== backend 3306 truth ====='
          docker run --rm mysql:5.7 mysql --get-server-public-key --ssl-mode=DISABLED -h127.0.0.1 -P3306 -uroot -p123456 -N -B -e 'SELECT id,HEX(name) FROM dbdump.t1 ORDER BY id; SHOW CREATE DATABASE dbdump; SHOW CREATE TABLE dbdump.t1\G' || true
          echo '===== backend 3307 truth ====='
          docker run --rm mysql:5.7 mysql --get-server-public-key --ssl-mode=DISABLED -h127.0.0.1 -P3307 -uroot -p123456 -N -B -e 'SELECT id,HEX(name) FROM dbdump.t1 ORDER BY id; SHOW CREATE DATABASE dbdump;' || true
      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binrt-diag-57
          path: target/ci/
