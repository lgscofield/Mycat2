# M1 验证网：JDK 21 构建 Mycat2 + MySQL/MariaDB 多版本兼容矩阵。
# 详见 docs/superpowers/plans/2026-09-30-m1-verification-net.md
name: Java CI - Mycat2 Compat Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # I-CI-2：手动重跑入口（启用后首个 CI run 不必等新 push；历史 push 不补跑）。
  workflow_dispatch:

jobs:
  compat:
    runs-on: ubuntu-latest
    # M1 目标=产出逐版本 pass/fail，不是全绿。尚未确认支持的版本标
    # experimental:true → 允许红但不阻塞 PR。M2/M3 逐档转绿后撤该标记。
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      # 矩阵 job 的职责=产出逐版本×逐格子 pass/fail 证据（M1 本意），非在 R5 前硬阻塞。
      # R0 已证 CRUD 操作轴 3 格深债（bit/timestampdiff/除零=I-DEBT-34/36/39）在**全部 7 版**皆红，
      # 要到里程碑 R5（基本 CRUD 全绿）才转绿——故全部档 experimental:true（红但不阻塞）。
      # 认证轴无真实缺口（native/caching_sha2 在七版合法插件组合上零红）。R5 绿后再逐档撤 experimental。
      matrix:
        include:
          - db: mysql:5.7
            experimental: true  # I-CI-6: poisonUrlKillsJdbcBackend 在 runner 上读超时，测试硬化后转 false
          - db: mysql:8.0
            experimental: false  # I-CI-5: 稳定档阻断（run #1 已实测绿）
          - db: mysql:8.4
            experimental: false  # I-CI-5: 稳定档阻断（run #1 已实测绿）
          - db: mysql:9.0
            experimental: false  # I-CI-5: 稳定档阻断（run #1 已实测绿）
          - db: mariadb:10.6
            experimental: true  # I-CI-6: poisonUrlKillsJdbcBackend 在 runner 上读超时
          - db: mariadb:10.11
            experimental: true  # I-CI-6: poisonUrlKillsJdbcBackend 在 runner 上读超时
          - db: mariadb:11.4
            experimental: true  # I-CI-6: Initialize containers 服务未起（CI infra）
    services:
      mysql-a:
        image: ${{ matrix.db }}
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MARIADB_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mysql-b:
        image: ${{ matrix.db }}
        ports: [ "3307:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MARIADB_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build server jar (skip test compile to isolate artifact vs compat-test)
        run: mvn -B install '-Dmaven.test.skip=true' -pl server -am
      # M2-1 L1 端到端门：真客户端过认证 + 会话初始化 + 一条查询，钉住 druid 影子导致的
      # NoSuchMethodError 不回归。I-DEBT-3/I-DEBT-4 已清 Calcite 层同 FQCN 影子（hbt DataContext
      # 副本已删，ROOT 寄生归位 MycatBindable），本机实证 L1 OK，硬门生效。
      # 步序注意：必须排在 Run example 之前——example 模块已知编译红（D13/I-DEBT-2），
      # 排在其后会被跳过，硬门变永不可达的假绿灯（终审 Important-1）。
      - name: Verify L1 query path
        run: bash ci/verify-l1.sh
      # M1 验收单位=逐格矩阵（spec ★验收标准），非全仓测试类总数。用 -Dtest 收窄到 compat
      # 四件套，把 C 层 example 深债（UserCaseTest 等）从 M1 门禁隔开（仅 CI 侧，本地全量不受影响）。
      - name: Run compat matrix (four-suite) against ${{ matrix.db }}
        env:
          COMPAT_DB: ${{ matrix.db }}
        run: bash ci/run-example.sh "-Dcompat.db=${{ matrix.db }}" "-Dtest=ConnectionSmokeTest,FrontAuthMatrixTest,BackendAuthMatrixTest,CrudResultMatrixTest"
