# M1 验证网：JDK 21 构建 Mycat2 + MySQL/MariaDB 多版本兼容矩阵。
# 详见 docs/superpowers/plans/2026-09-30-m1-verification-net.md
name: Java CI - Mycat2 Compat Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compat:
    runs-on: ubuntu-latest
    # M1 目标=产出逐版本 pass/fail，不是全绿。尚未确认支持的版本标
    # experimental:true → 允许红但不阻塞 PR。M2/M3 逐档转绿后撤该标记。
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql:5.7
            experimental: false
          - db: mysql:8.0
            experimental: false
          - db: mysql:8.4
            experimental: false
          - db: mysql:9.0
            experimental: true
          - db: mariadb:10.6
            experimental: true
          - db: mariadb:10.11
            experimental: true
          - db: mariadb:11.4
            experimental: true
    services:
      mysql-a:
        image: ${{ matrix.db }}
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MARIADB_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mysql-b:
        image: ${{ matrix.db }}
        ports: [ "3307:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MARIADB_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build server jar (skip test compile to isolate artifact vs compat-test)
        run: mvn -B install '-Dmaven.test.skip=true' -pl server -am
      - name: Run example + compat smoke against ${{ matrix.db }}
        env:
          COMPAT_DB: ${{ matrix.db }}
        run: bash ci/run-example.sh "-Dcompat.db=${{ matrix.db }}"
      # M2-1 L1 端到端门：真客户端过认证 + 会话初始化 + 一条查询，钉住 druid 影子导致的
      # NoSuchMethodError 不回归。当前受 Calcite 层同类影子（hbt 内 SqlValidatorImpl 等 12 个
      # 与 calcite-core 同 FQCN 的副本）阻断，故先不卡住整张网；看板债务清空后去掉本行。
      - name: Verify L1 query path
        continue-on-error: true
        run: bash ci/verify-l1.sh
