# M1 验证网：JDK 21 构建 Mycat2 + MySQL/MariaDB 多版本兼容矩阵。
# 详见 docs/superpowers/plans/2026-09-30-m1-verification-net.md
name: Java CI - Mycat2 Compat Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # I-CI-2：手动重跑入口（启用后首个 CI run 不必等新 push；历史 push 不补跑）。
  workflow_dispatch:

jobs:
  compat:
    runs-on: ubuntu-latest
    # M1 目标=产出逐版本 pass/fail。历史：R0 时全部档 experimental:true（CRUD 深债 7 版皆红）；
    # 2026-10-19 逐档撤实验完毕：全 7 档 experimental:false，任何档红均阻断 PR（闸门全牙闭环，
    # 背书见 DEBT-QUEUE §5：I-CI-6 socketFactory 根治 + 11.4 healthcheck 修复 + 多轮全绿）。
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      # 矩阵 job 的职责=产出逐版本×逐格子 pass/fail 证据（M1 本意）。
      # 早期全部档 experimental:true（红不阻断）；随 R5 CRUD 三根收口、I-CI-6 根治、11.4 healthcheck 修复，
      # 2026-10-16 稳定档先转 false（I-CI-5），2026-10-19 余档全部转 false（本注释即关闭序终点记录）。
      matrix:
        include:
          - db: mysql:5.7
            persona: MYSQL_5_7
            experimental: false  # I-CI-6 已根治（socketFactory 确定性毒药）；连续 5 run 全绿后 2026-10-19 用户拍板撤实验档→阻断 PR
          - db: mysql:8.0
            persona: MYSQL_8_0
            experimental: false  # I-CI-5: 稳定档阻断（run #1 已实测绿）
          - db: mysql:8.4
            persona: MYSQL_8_4
            experimental: false  # I-CI-5: 稳定档阻断（run #1 已实测绿）
          - db: mysql:9.0
            persona: MYSQL_9_X
            experimental: false  # I-CI-5: 稳定档阻断（run #1 已实测绿）
          - db: mariadb:10.6
            persona: MARIADB_10_6
            experimental: false  # I-CI-6 已根治；连续 5 run 四件套+M3/M4+真二进制全绿后 2026-10-19 用户拍板撤实验档→阻断 PR
          - db: mariadb:10.11
            persona: MARIADB_10_11
            experimental: false  # I-CI-6 已根治；同上，连续 5 run 全绿，2026-10-19 用户拍板撤实验档→阻断 PR
          - db: mariadb:11.4
            persona: MARIADB_11_4
            experimental: false  # healthcheck bug 已修（`7c0a82f70`）；真跑产测连续 5 run 全绿（含 2026-10-19 三轮 dispatch 验证），随三档同批撤实验档→阻断 PR，M1 闸门全 7 档有牙闭环
    services:
      mysql-a:
        image: ${{ matrix.db }}
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MARIADB_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -p123456 || mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mysql-b:
        image: ${{ matrix.db }}
        ports: [ "3307:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MARIADB_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -p123456 || mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build server jar (skip test compile to isolate artifact vs compat-test)
        run: mvn -B install '-Dmaven.test.skip=true' -pl server -am
      # M2-1 L1 端到端门：真客户端过认证 + 会话初始化 + 一条查询，钉住 druid 影子导致的
      # NoSuchMethodError 不回归。I-DEBT-3/I-DEBT-4 已清 Calcite 层同 FQCN 影子（hbt DataContext
      # 副本已删，ROOT 寄生归位 MycatBindable），本机实证 L1 OK，硬门生效。
      # 步序注意：必须排在 Run example 之前——example 模块已知编译红（D13/I-DEBT-2），
      # 排在其后会被跳过，硬门变永不可达的假绿灯（终审 Important-1）。
      - name: Verify L1 query path
        run: bash ci/verify-l1.sh
      # M1 验收单位=逐格矩阵（spec ★验收标准），非全仓测试类总数。用 -Dtest 收窄到 compat
      # 四件套，把 C 层 example 深债（UserCaseTest 等）从 M1 门禁隔开（仅 CI 侧，本地全量不受影响）。
      - name: Run compat matrix (four-suite) against ${{ matrix.db }}
        env:
          COMPAT_DB: ${{ matrix.db }}
        run: bash ci/run-example.sh "-Dcompat.db=${{ matrix.db }}" "-Dtest=ConnectionSmokeTest,FrontAuthMatrixTest,BackendAuthMatrixTest,CrudResultMatrixTest"
      # M3/M4 专项套件进 CI（dump 查询面+往返回灌+迁移矩阵，纯 JDBC、自带 assumeInfraUp 诚实门控）。
      # persona 随矩阵档对齐后端版本（dump 面版本门/迁移 DDL 方言随画像变，与本地逐 persona 实跑同口径）。
      # 观察期已撤（run@e2a6c29f2：稳定档 8.0/8.4/9.0 该步全绿 + 本地彩排 6/6，I-CI-5 姿势转正式门禁）；
      # 实验档 job 级仍由 matrix.experimental 兜底不阻塞 run。
      - name: Run M3/M4 suites (dump surface/round-trip + migrate) against ${{ matrix.db }}
        env:
          COMPAT_DB: ${{ matrix.db }}
          MYCAT_PERSONA: ${{ matrix.persona }}
        run: bash ci/run-example.sh "-Dcompat.db=${{ matrix.db }}" "-Dtest=DumpSurfaceMatrixTest,DumpRestoreRoundTripMatrixTest,MigrateMatrixTest"
      # I-DEBT-54 真二进制 mysqldump/mariadb-dump 全类型（含 bit(8)）往返回灌金标准网（逐矩阵档）。
      # 二进制跑在与矩阵同版的容器里（主机零装 mysqldump），逐档自适应选客户端/dump 二进制名与认证 flag 方言；
      # 字节安全回灌（bash < dump.sql）→ 逐值断言（BIN(bit)/HEX(中文)/decimal/生列/text）。判据=RC=0+逐值命中，
      # 容忍那条已知非致命 tablespaces Calcite stderr（否则假红）。本地 mysql:8.0 已实跑 BINRT PASS。
      # ⚠ 旧「runner flaky」定性已被 2026-10-19 诊断推翻：读原始 stdout（非被 continue-on-error 掩盖的步级 conclusion）坐实
      # run@93fc5cda4 与 run@c993c337a 的该步**都**在 STEP1 报 `ERROR 2003(111) host.docker.internal:8066`=ECONNREFUSED，
      # 即本步在 Linux runner 上从未真绿过、是**确定性失败**（"绿 run" 只是 coe 把 exit1 掩盖成步绿+我把 job 绿误读成步绿）。
      # 根因：Mycat 运行期只绑回环（fat-jar 走代码缺省 ServerConfig.ip="localhost"，server.json 的 0.0.0.0 未被加载），
      #   宿主 wait_for_port 探 127.0.0.1 通、但容器经 host-gateway(172.17.0.1) 连回环-only 监听必被 RST 拒；非起停 race（该 run Mycat started up 早于 seed 14s）。
      #   JDBC 四件套/M3M4 步是宿主直连 127.0.0.1、从不跨容器，故从未暴露此洞。
      # 修法（测试基建·零产品码）：verify-mysqldump-binary-roundtrip.sh 在 Linux 改 --network host + 直连 127.0.0.1（回环 Mycat + 已发布 0.0.0.0:3307 后端均可达）。
      # run@61eb56afa 三轮取证坐实修法全效：ECONNREFUSED 零出现，5 档×3 轮全 BINRT PASS；新暴露两个确定性红：
      #   ① mysql:5.7 seed ERROR 1366（官方镜像 server 默认 latin1，裸 CREATE DATABASE 继承之——测试基建缺陷，seed 显式 utf8mb4 已修 `468566830`）；
      #      承修后又暴第三红：5.7 档 STEP4 读回 HEX(name)=3F3F(??)——Mycat SHOW CREATE DATABASE 仿真面丢弃库级字符集（产品缺口 I-DEBT-58），
      #      回灌 latin1 默认靶中文损化；Mycat SHOW CREATE TABLE 透传表级字符集，故 seed CREATE TABLE 钉 utf8mb4 即绕过（`ed7795914`）。
      #   ② mariadb:11.4 dump rc=2（mariadb-dump 原样下发 /*M!100100 ...*/ 条件注释被 Mycat 判 1105 Illegal syntax——产品兼容面缺口 I-DEBT-57）。
      # ✅ 2026-10-19 三轮取证（run@39200417484/39200476277/39200481430）连续一致：6/7 档（mysql 5.7/8.0/8.4/9.0 + mariadb 10.6/10.11）全 BINRT PASS×3。
      # 已由观察期转硬门（人拍板口径 A）：6 档真红即阻断 PR；唯 mariadb:11.4 因产品缺口 I-DEBT-57（非测试基建、不可测端修）保窄 coe/expected-fail，
      #   待 I-DEBT-57 专轮修好后摘掉该窄 coe、回归全 7 档一刀硬门。
      - name: Verify real-binary dump round-trip (full types incl bit(8)) against ${{ matrix.db }}
        continue-on-error: ${{ matrix.db == 'mariadb:11.4' }}  # 硬门：除 mariadb:11.4（产品缺口 I-DEBT-57 窄豁免）外全部档真失败即阻断 PR
        env:
          COMPAT_DB: ${{ matrix.db }}
          MYCAT_PERSONA: ${{ matrix.persona }}
        run: bash ci/verify-mysqldump-binary-roundtrip.sh

  # I-DEBT-9 旧 Java Connector 线冒烟网（B 层仪器，spec §3 M2“全 connector 跑基本 CRUD”）。
  # 与后端版本无关（量的是旧客户端过 Mycat 前端的认证/CRUD 兼容面），故单 job 不进矩阵；
  # 不起多 connector 同 classpath（类遮蔽），verify-old-connector.sh 逐线 java -cp 单喂一个旧 jar。
  old-connector:
    runs-on: ubuntu-latest
    services:
      mysql-a:
        image: mysql:8.0
        ports: [ "3306:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mysql-b:
        image: mysql:8.0
        ports: [ "3307:3306" ]
        env:
          MYSQL_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build server jar (skip test compile)
        run: mvn -B install '-Dmaven.test.skip=true' -pl server -am
      # 旧线清单：Connector/J 5.1 末版（旧类名 com.mysql.jdbc.Driver，早于 caching_sha2）+ 8.x 首档。
      - name: Run old Java connector line smoke net
        run: bash ci/verify-old-connector.sh
